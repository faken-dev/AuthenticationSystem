# ═══════════════════════════════════════════════════════════════════════════
# CI — AuthenticateSystem
#
# Triggers:
#   • push to develop → run lint + tests
#   • push to master  → run lint + tests + docker build
#   • pull request → run lint + tests
#
# Jobs:
#   1. lint     — static analysis
#   2. test     — compile + run tests (Testcontainers)
#   3. build    — build & push Docker image (master only)
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ────────────────────────────────────────────────────────────────────────
  # Job 1 — Lint / Static analysis
  # ────────────────────────────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven Check
        run: ./mvnw -B -q verify -DskipTests


  # ────────────────────────────────────────────────────────────────────────
  # Job 2 — Build & Test
  # ────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers will start PostgreSQL & Redis automatically
      - name: Run tests
        run: ./mvnw -B verify

        env:
          JWT_SECRET: ci-test-secret-not-used
          SENDGRID_API_KEY: SG.test
          SENDGRID_OTP_TEMPLATE_ID: d-test
          TWILIO_ACCOUNT_SID: ACtest
          TWILIO_AUTH_TOKEN: test
          TWILIO_WHATSAPP_FROM: whatsapp:+84123456789
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          FACEBOOK_APP_ID: test
          FACEBOOK_APP_SECRET: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports/
          retention-days: 7


  # ────────────────────────────────────────────────────────────────────────
  # Job 3 — Docker Build & Push
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max